# Local development stack. Run `cp .env.example .env`, fill the placeholders, then `make up`.
name: contextforge

x-backend: &backend
  build:
    context: ./backend
    args:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
    S3_ENDPOINT_URL: http://seaweedfs:8333
    QDRANT_URL: http://qdrant:6333
    # Embedding model is baked into the image; never reach out to Hugging Face at runtime.
    HF_HUB_OFFLINE: "1"
    EMBEDDING_CACHE_DIR: /models
  # Optional host cache (data/hf-cache) so a model can be provided without rebuilding the image.
  # `make model` downloads it; the baked-in model in the image is used when the cache is empty.
  volumes:
    - ./data/hf-cache:/models:ro
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
      - "127.0.0.1:8889:8889"   # SeaweedFS filer UI behind basic auth (demo / Demo-Pass-2026!)
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  # One-shot: migrations + bucket + Qdrant collection. api/worker wait for it.
  init:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py init_services"
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}

  api:
    <<: *backend
    depends_on:
      init: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency=2
    depends_on:
      init: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # Image has no curl/wget; use bash /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
    volumes:
      - seaweeddata:/data
      - ./infra/seaweedfs/entrypoint.sh:/init/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmqdata:
  qdrantdata:
  seaweeddata:
