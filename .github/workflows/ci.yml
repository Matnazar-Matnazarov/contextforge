name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contextforge
          POSTGRES_PASSWORD: contextforge
          POSTGRES_DB: contextforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contextforge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://contextforge:contextforge@localhost:5432/contextforge
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "1"
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
